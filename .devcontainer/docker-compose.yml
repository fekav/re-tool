services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    command: sleep infinity
    working_dir: /workspace
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ..:/workspace:cached
    env_file:
      - devcontainer.env
    environment:
      QUARKUS_PROFILE: dev
      JAVA_HOME: /usr/local/sdkman/candidates/java/current

      OLLAMA_BASE_URL: http://ollama:11434

      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: devpassword
    depends_on:
      ollama:
        condition: service_started
      neo4j:
        condition: service_healthy
    networks:
      - devnet

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    healthcheck:
      test: ["CMD-SHELL", "OLLAMA_HOST=http://127.0.0.1:11434 ollama list >/dev/null"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - devnet

  ollama-init:
    image: ollama/ollama:latest
    restart: "no"
    env_file:
      - devcontainer.env
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -eu
      - -c
      - |
        echo "Pulling Ollama model: $${OLLAMA_MODEL}"
        ollama pull "$${OLLAMA_MODEL}"

        echo "Verifying Ollama model: $${OLLAMA_MODEL}"
        ollama show "$${OLLAMA_MODEL}" >/dev/null
        ollama list
    command: []
    networks:
      - devnet

  chat:
    build:
      context: ..
      dockerfile: chainlit/Dockerfile
    restart: unless-stopped
    volumes:
      - ../chainlit:/app:cached
    env_file:
      - devcontainer.env
    environment:
      QUARKUS_BASE_URL: http://app:8080
      OLLAMA_BASE_URL: http://ollama:11434
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      app:
        condition: service_started
      ollama-init:
        condition: service_completed_successfully
    networks:
      - devnet

  neo4j:
    image: neo4j:5-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/devpassword
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
      - neo4j-import:/var/lib/neo4j/import
      - neo4j-plugins:/plugins
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p devpassword 'RETURN 1;'"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s
    networks:
      - devnet

volumes:
  gradle-cache:
  ollama-data:
  neo4j-data:
  neo4j-logs:
  neo4j-import:
  neo4j-plugins:

networks:
  devnet:
    driver: bridge
